# The nested Sway the UI scenarios run in (tests/ui/run.sh). Two
# outputs, so per-output behaviour gets exercised; the second one is
# created at startup (headless outputs are added on request).
output HEADLESS-1 resolution 1920x1080 position 0,0
output HEADLESS-2 resolution 1920x1080 position 1920,0
exec swaymsg create_output
exec "$ARIA_UI_ROOT/tests/ui/inner.sh"
