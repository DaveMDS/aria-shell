# E17's own config, read over the user's with `[general] theme_config
# = yes` (or the Themes gadget's menu): the shelf at the bottom, every
# gadget in the middle, as E17 had it.

[general]
color_scheme = dark
terminal = terminology %c

[panel]
outputs = all
position = bottom
layer = top
items_center = Custom:menu WorkSpaces Themes Tray Brightness SystemMonitor:temp Clock Audio Network Power

# the main menu's button, the arrow at the shelf's start
[Custom:menu]
icon = go-up-symbolic
command = aria-shell launcher toggle
command_right = aria-shell exiter toggle

# the pager: the desks, no window marks, no title
[WorkSpaces]
show_name = no
show_windows = no
show_title = no

# the thermometer
[SystemMonitor:temp]
show = temp
mode = text
format = {temp}°
warning = 70
critical = 85

[Clock]
format = %H:%M
