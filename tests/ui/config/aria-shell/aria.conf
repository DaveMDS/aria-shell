# Config for the UI scenarios (tests/ui): the base theme, no reloads.
[general]
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_start = WorkSpaces
items_center = Clock
items_end = Clock:2

[Clock]
format = %H:%M:%S

[Clock:2]
format = %d %b %Y

[WorkSpaces]

[launcher]
terminal = true
