# The idle scenario's shell: timeouts of seconds, the screens dimming,
# then going off before the lock; the lock screen without a password
# (Enter unlocks).
[general]
theme =
reload_theme = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock Power

[Clock]

[Idle]
dim = 1s
screen_off = 2s
lock = 4s

[locker]
password_prompt = no

# The laptop's own panel stays out of it (the monitors are
# tests/ui/bin/ddcutil's).
[Brightness]
backlight = no
