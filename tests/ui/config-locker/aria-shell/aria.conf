# The locker scenario's second shell: the lock screen asking a password
# (PAM refuses the scenario's), no avatar or date to keep the tree small.
[general]
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock

[Clock]

[locker]
password_prompt = yes
show_avatar = no
show_date = no
# a service with no /etc/pam.d file: `other` denies at once, and nothing
# is counted against the developer's account (pam_faillock would lock it
# after three runs of the scenario on a real service)
pam_service = aria-shell-ui-test
