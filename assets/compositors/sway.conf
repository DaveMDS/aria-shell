# Aria Shell on Sway: start it and bind its keys. Copy what you need
# into your config; `aria-shell` must be on the PATH, or write its full
# path.

# Start: as a systemd user service with the session (UWSM, or
# sway-systemd: `systemctl --user enable aria-shell.service`, nothing
# here), or here, with the compositor:
exec aria-shell

# The launcher, the exit menu, the lock screen
bindsym $mod+space exec aria-shell launcher toggle
bindsym $mod+Escape exec aria-shell exiter toggle
bindsym $mod+l exec aria-shell lock

# Volume: whatever changes it, the shell shows its OSD by itself
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness: every screen (the laptop's panel, the monitors over
# DDC/CI); the shell shows its OSD on each. `--output eDP-1` for one
bindsym --locked XF86MonBrightnessUp exec aria-shell brightness up
bindsym --locked XF86MonBrightnessDown exec aria-shell brightness down
