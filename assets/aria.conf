# Aria Shell (Rust) - sample/dev configuration
#
# Only the sections actually read by the current spike are here (just
# Clock for now). See aria-shell-python/aria_shell/assets/aria.conf for
# the full set of sections the original Python implementation supports.

[Clock]
# see: https://docs.rs/chrono/latest/chrono/format/strftime/index.html
format = %H:%M:%S
tooltip_format = %A %d %B %Y
