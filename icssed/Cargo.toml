[package]
name = "icssed"
version = "0.0.1"
edition = "2024"
description = "CSS-styled widgets on iced"
publish = false

[dependencies]
iced = { version = "0.14", features = ["advanced", "svg", "image-without-codecs", "canvas"] }
cssparser = "0.38"
# A theme's images: decoded at load (iced draws whole images, a 9-patch
# is cut here).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustc-hash = "2"
log = "0.4"
# The headless harness's `UserInterface` (iced doesn't re-export it):
# already in iced's tree, compiled anyway.
iced_runtime = "0.14"

[features]
# The headless harness, for an app's tests too.
testing = []

[dev-dependencies]
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["time"] }
notify = "8.2"
env_logger = "0.11"

[[bench]]
name = "costs"
harness = false
required-features = ["testing"]
