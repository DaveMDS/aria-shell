# The idle scenario's shell: timeouts of seconds, the screens going off
# before the lock; the lock screen without a password (Enter unlocks).
[general]
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock Power

[Clock]

[Idle]
screen_off = 2s
lock = 4s

[locker]
password_prompt = no
