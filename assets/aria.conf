# Aria Shell (Rust) - sample/dev configuration
#
# Only the sections the Rust port reads so far. See
# aria-shell-python/aria_shell/assets/aria.conf for the full set of
# sections the original implementation supports.
#
# [Name] is the default instance of a section, [Name:id] an extra one.
# Empty values mean "use the default". No inline comments.

[general]
# the UI language (en, it); empty = the environment's LC_ALL, LC_MESSAGES
# or LANG, in that order
language =
# theme to load on top of the built-in base: a name looked up as
# themes/<name>.css in ~/.config/aria-shell, the XDG data dirs and
# assets/, or a path. Empty = base only. See assets/base.css.
style =
# light | dark: the colour scheme the theme is loaded for (:root.light /
# :root.dark variables); the Themes gadget switches it at runtime
color_scheme = light
# reload the theme when its file changes
reload_style = yes
# rebuild the panels when this file changes
reload_config = yes
# icon theme for window icons; empty = the GTK one from settings.ini, else Adwaita
icon_theme =

# the application launcher, toggled with `aria-shell launcher toggle`
# (bind it in the compositor); size and look come from the theme
[launcher]
# terminal for entries with Terminal=true, run as `<terminal> -e <cmd>`;
# empty = $TERMINAL, else the first of kitty, alacritty, foot, wezterm, ghostty,
# gnome-terminal, konsole, xfce4-terminal, xterm found
terminal =

# the desktop background: an image (png, jpg, webp) as an absolute
# path, ~/..., or a path relative to this file's directory; empty =
# none. `fit` is CSS object-fit: cover (fills the output, edges cropped),
# contain (whole image, bands of the theme's `wallpaper` background),
# fill (stretched), none (1:1, centred), scale-down (none, shrunk when
# it doesn't fit). A [wallpaper:<connector>] section with a source wins
# on that output
[wallpaper]
source =
fit = cover

# the lock screen, `aria-shell lock` (bind it in the compositor, or give
# it to an idle daemon). The password is checked with PAM.
[locker]
# require the user password to unlock
password_prompt = yes
# the user picture (~/.face, ~/.face.icon or the AccountsService one)
show_avatar = yes
show_username = yes
# the time and the date, strftime patterns as the Clock's
show_time = yes
show_date = yes
time_format = %H:%M
date_format = %A %d %B
# the PAM service the password is checked with.
# empty = `aria-shell` if /etc/pam.d/aria-shell is installed, else `login`.
pam_service =

# notifications: the daemon (org.freedesktop.Notifications, one popup per
# notification stacked from a screen corner of the focused output; the
# look comes from the theme) and the bar gadget of the same name (a bell
# with the count of the notifications not looked at; left click opens
# the history, right click toggles do-not-disturb, middle click closes
# the popups on screen). The daemon runs whether or not the gadget is
# on a panel.
[Notifications]
# serve notifications at all (off if another daemon should)
enabled = yes
# seconds a notification stays when the app doesn't say (critical ones
# stay until dismissed)
duration = 20
# top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
position = top-right
# how many notifications the gadget's history keeps (0: none)
history = 50
# the gadget's icon names, from the icon theme (the second while
# do-not-disturb is on)
icon = preferences-system-notifications-symbolic
dnd_icon = notifications-disabled-symbolic

# window class -> desktop entry id or icon name, for apps whose class
# matches none of their desktop entry's id, StartupWMClass or Exec
[apps_class_map]
# jetbrains-pycharm-ce = pycharm

# the system monitor: this section is the sampler's (readings shared by
# every gadget) and the popup's; the gadgets are the instances below,
# one value each
[SystemMonitor]
# seconds between readings (min 1)
interval = 2
# readings kept: the width of the graphs, in time
history = 60
# mount points to show; empty = every real filesystem, one per device
disks =
# interfaces to show; empty = all but the loopback and the virtual ones
interfaces =
# the hwmon sensor (its `name`) for the cpu temperature; empty = auto
temperature =
# rows of the popup's process table, and its initial sort:
# cpu | mem | name | pid
processes = 15
sort = cpu

# a gadget: one value on the bar (as text, a sparkline or a gauge);
# left click opens the monitor popup on the value's tab (cpu, memory,
# disks, network, gpu, processes), right click runs `command`. `show`
# is required.
[SystemMonitor:cpu]
# cpu | mem | swap | disk | net | gpu | temp | load
show = cpu
# text: the format alone; sparkline: the value's history as a small
# graph with the format over it; gauge: a bar filled to the value with
# the format over it
mode = sparkline
# the text; placeholders: {cpu} {mem} {mem_used} {mem_total} {swap} {rx} {tx}
# {read} {write} {disk} {temp} {freq} {load1} {load5} {load15} {uptime}
# {gpu} {vram}; {cpu:3} pads to 3 characters. Empty = the value's own
format = CPU {cpu}%
# the top of the sparkline / the full gauge; empty = 100 for a
# percentage, the highest value seen otherwise (e.g. 90 for temp)
max =
# from these values on the gadget is styled as a warning / critical
# (same unit as the value: %, °C, bytes/s, load); empty = 70 / 90 for
# a percentage, nothing otherwise
warning =
critical =
# an icon name before the text; empty = none
icon =
# right click; empty = btop, htop or top (the first found) in the
# launcher's terminal
command =

[SystemMonitor:mem]
show = mem
mode = gauge
format = MEM {mem}%

[SystemMonitor:temp]
show = temp
mode = text
max = 90
warning = 60
critical = 80

[panel]
# all, or connector names: DP-1 HDMI-A-1
outputs = all
# top | bottom
position = top
# bottom | top | overlay
layer = top
items_start = Custom:launcher WorkSpaces
items_center = Themes SystemMonitor:cpu SystemMonitor:mem SystemMonitor:temp Clock Custom:updates
items_end = Tray Audio Notifications Clock:2

[Clock]
# see: https://docs.rs/chrono/latest/chrono/format/strftime/index.html
format = %H:%M:%S

[Clock:2]
format = %e %b %Y

# the status notifier items (nm-applet, megasync, ...); no keys
[Tray]

# the volume: the default output's level as an icon; left click opens
# the mixer (outputs, inputs, the streams playing, the media players),
# the wheel changes the volume, middle click mutes, right click runs
# mixer_command
[Audio]
# a real mixer, run by the popup's button and a right click
mixer_command = pavucontrol
# percent per wheel click
step = 5
# the sliders' and the wheel's ceiling, percent (up to 150)
max_volume = 100
# the percent after the icon
show_percent = no
# the default input's icon too, with its own wheel / middle click
show_microphone = no
# the popup's sections
show_inputs = yes
show_streams = yes
show_players = yes

# light/dark toggle (left click) and theme picker (right click)
[Themes]
# icon names shown while each scheme is on
light_icon = weather-clear-symbolic
dark_icon = weather-clear-night-symbolic

[WorkSpaces]
# show the workspace name
show_name = yes
# show a marker for each window in the workspace
show_windows = yes
# the active window's icon and title after the workspaces
show_title = yes
# show workspaces from all monitors, not just this panel's one
all_monitors = no
# clicking a window marker focuses that window
focus_window_on_click = no

# a user-defined button: icon and/or label, a program per mouse button,
# optionally a program whose output is the label. Programs run as
# written, without a shell: quote with '' or "", and write `sh -c '...'`
# yourself for pipes or variables. [Custom:id] for more of them.
[Custom:launcher]
# fixed text, and an icon name from the icon theme
label =
icon = start-here-symbolic
# run on the left / right / middle button and on the wheel; the shell's
# own commands are its CLI (`aria-shell launcher toggle`: that name is
# always this very binary, on the PATH or not)
command = aria-shell launcher toggle
command_right =
command_middle =
command_wheel_up =
command_wheel_down =
# program whose standard output is the label, run every `interval`
# seconds (0 = once at start) and again after every command above.
# return_type = text takes the output as is; json reads
# {"text": "..", "icon": "..", "class": ".." or [..]} (waybar's shape;
# the classes style the button: gadget.custom > button.warning)
exec =
interval = 0
return_type = text
# the label: {} is exec's output (or `label` when there's no exec),
# {label} the label key
format = {}
# with exec: show nothing while the output is empty or the program fails
hide_empty = yes

[Custom:updates]
icon = software-update-available-symbolic
exec = sh -c 'checkupdates 2>/dev/null | wc -l | grep -v "^0$"'
interval = 1800
command = kitty -e sh -c 'sudo pacman -Syu; read'
