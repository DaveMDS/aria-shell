# Aria Shell on Hyprland (before 0.56, hyprlang config): start it and
# bind its keys. Copy what you need into your config; `aria-shell` must
# be on the PATH, or write its full path.

# Start: as a systemd user service with the session (UWSM:
# `systemctl --user enable aria-shell.service`, nothing here), or here,
# with the compositor:
exec-once = aria-shell

# The launcher, the exit menu, the lock screen
bind = SUPER, Space, exec, aria-shell launcher toggle
bind = SUPER, Escape, exec, aria-shell exiter toggle
bind = SUPER, L, exec, aria-shell lock

# Volume: whatever changes it, the shell shows its OSD by itself
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness: every screen (the laptop's panel, the monitors over
# DDC/CI); the shell shows its OSD on each. `--output eDP-1` for one
bindel = , XF86MonBrightnessUp, exec, aria-shell brightness up
bindel = , XF86MonBrightnessDown, exec, aria-shell brightness down
