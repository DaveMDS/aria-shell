# The power scenario's shell: the Power gadget on both bars, the
# notifications daemon for the low battery one, timeouts on AC and on
# battery to tell which are armed.
[general]
language = en
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock Power

[Clock]

[Notifications]

[Power]
settings_command = sh -c 'echo settings >> "$ARIA_UI_OUT/power-settings"'

[Idle]
lock = 1h

[Idle:battery]
lock = 30m
