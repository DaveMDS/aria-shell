[package]
name = "aria-shell"
version = "0.0.1"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced"] }
iced_exwlshell = "0.20.1"
iced_wayland_subscriber = "0.20.1"
configparser = { version = "3", features = ["indexmap"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
csscolorparser = "0.8.4"
notify = "8.2.0"
