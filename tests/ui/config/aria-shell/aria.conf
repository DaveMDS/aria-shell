# Config for the UI scenarios (tests/ui): the base theme, no reloads,
# English whatever the desktop's LANG (tests/ui/config-locale is the
# Italian one).
[general]
language = en
style =
reload_style = no
reload_config = no
# a terminal that runs nothing: system-monitor.sh and open.sh read its
# command line
terminal = true
# a file manager that only says where it was opened (open.sh)
file_manager = sh -c 'echo "$1" >> "$ARIA_UI_OUT/opened"' sh

# every scenario's shell writes these in its output dir (autostart.sh
# reads them): in order, a line without a command skipped
[autostart]
first = sh -c 'echo first >> "$ARIA_UI_OUT/autostart"'
nothing =
second = sh -c 'echo "second a=b: c" >> "$ARIA_UI_OUT/autostart"'

[panel]
outputs = all
position = top
layer = top
items_start = Custom:static WorkSpaces
items_center = Clock Notifications Audio Network SystemMonitor:cpu SystemMonitor:mem SystemMonitor:net SystemMonitor:disk
items_end = Custom:echo Custom:json Custom:silent Custom:once Themes Tray Clock:2 Screenshot

[Clock]
format = %H:%M:%S

[Clock:2]
format = %d %b %Y

[WorkSpaces]

[Tray]

# the mixer part shows whatever the machine has (or nothing); the
# player part is the scenario's fake player
[Audio]
mixer_command = sh -c 'echo mixer >> "$ARIA_UI_OUT/clicks"'
show_percent = yes
show_microphone = yes

# the network: the scenario's fake NetworkManager (tests/ui/nm) on the
# private bus; the settings button writes in $ARIA_UI_OUT/clicks
[Network]
settings_command = sh -c 'echo settings >> "$ARIA_UI_OUT/clicks"'
show_label = yes

# the OSD: short, so the osd scenario can see it go; the network is the
# fake NetworkManager, the volume the machine's own (not asserted)
[osd]
show = volume microphone recording wifi network vpn charger profile idle
duration = 1
position = bottom
margin = 100

[Themes]

# a static button that opens the launcher (the shell's own CLI: our
# name runs the binary under test); the other buttons write their name in
# $ARIA_UI_OUT/clicks (a shell, so the variable expands)
[Custom:static]
label = Aria
icon = start-here-symbolic
command = aria-shell launcher show
command_right = sh -c 'echo right >> "$ARIA_UI_OUT/clicks"'
command_middle = sh -c 'echo middle >> "$ARIA_UI_OUT/clicks"'
command_wheel_up = sh -c 'echo up >> "$ARIA_UI_OUT/clicks"'
command_wheel_down = sh -c 'echo down >> "$ARIA_UI_OUT/clicks"'

# a label from a program, once
[Custom:echo]
exec = echo hi
format = out: {}

# JSON: text, class, icon
[Custom:json]
exec = echo '{"text": "3", "class": "warning", "icon": "weather-clear-symbolic"}'
return_type = json

# an empty output hides the gadget
[Custom:silent]
exec = true

# counts its runs: one for both panels, another after a click
[Custom:once]
exec = sh -c 'echo run >> "$ARIA_UI_OUT/runs"; wc -l < "$ARIA_UI_OUT/runs"'
command = true

# two tiny PNGs (tests/ui/config/aria-shell/wallpapers), stretched
[wallpaper]
source = wallpapers/a.png
fit = fill

[wallpaper:HEADLESS-2]
source = wallpapers/b.png
fit = fill

# the exit menu: every command writes its name in $ARIA_UI_OUT/exits
# (a shell, so the variable expands); a short countdown; logout not
# `auto`, the nested Sway would exit
[exiter]
confirm_timeout = 3
lock = aria-shell lock
suspend = sh -c 'echo suspend >> "$ARIA_UI_OUT/exits"'
hibernate = sh -c 'echo hibernate >> "$ARIA_UI_OUT/exits"'
logout = !sh -c 'echo logout >> "$ARIA_UI_OUT/exits"'
reboot = !sh -c 'echo reboot >> "$ARIA_UI_OUT/exits"'
shutdown = !sh -c 'echo shutdown >> "$ARIA_UI_OUT/exits"'

# the lock screen without a password (the PAM path needs its own shell,
# tests/ui/config-locker, the scenario starts it)
[locker]
password_prompt = no
time_format = %H:%M:%S

[Notifications]
duration = 2
history = 5

# the system monitor: fast readings, a short table; one instance per
# value
[SystemMonitor]
interval = 1
processes = 5

# constant texts (but the memory's): the clock shares the centre slot
# and its scenario expects it not to move between two readings
[SystemMonitor:cpu]
show = cpu
format = cpu
command = sh -c 'echo run >> "$ARIA_UI_OUT/sysmon"'

[SystemMonitor:mem]
show = mem
mode = gauge
format = MEMORY LONG {mem}%

# net: a rate, no thresholds unless set: critical from 0 on
[SystemMonitor:net]
show = net
mode = text
format = net
critical = 0

[SystemMonitor:disk]
show = disk
format = disk
max = 1000000
warning = 0

# The laptop's own panel stays out of it (the monitors are
# tests/ui/bin/ddcutil's).
[Brightness]
backlight = no

# An editor that only says what it was given.
[Screenshot]
editor = sh -c 'echo "$1" > "$ARIA_UI_OUT/edited"' sh
