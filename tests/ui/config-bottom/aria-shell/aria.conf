# The bottom-bar scenario's shell: one bar at the bottom of both
# outputs, with a clock for a popup to open from.
[general]
language = en
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = bottom
layer = top
items_center = Clock

[Clock]

# The laptop's own panel stays out of it (the monitors are
# tests/ui/bin/ddcutil's).
[Brightness]
backlight = no
