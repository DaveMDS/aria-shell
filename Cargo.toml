[package]
name = "aria-shell"
version = "0.0.1"
edition = "2024"

[workspace]
members = [".", "tests/ui/inject", "tests/ui/sni", "tests/ui/mpris", "tests/ui/nm", "tests/ui/upower", "tests/ui/udisks"]

[dependencies]
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced", "svg", "image-without-codecs", "canvas"] }
iced_exwlshell = "0.20.1"
iced_wayland_subscriber = "0.20.1"
configparser = { version = "3", features = ["indexmap"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
# chrono's own locale data, for the decimal point chrono keeps to itself
pure-rust-locales = "0.8"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
csscolorparser = "0.8.4"
notify = "8.2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
libc = "0.2"
libpulse-binding = "2.30.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# the KDE places file (user-places.xbel), and the bookmarks' file:// URIs
roxmltree = "0.20"
percent-encoding = "2"
