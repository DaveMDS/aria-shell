# The locale scenario's second shell: Italian texts and dates.
[general]
language = it
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock Notifications SystemMonitor:cpu

[Clock]
format = %A %d %B %Y

[Notifications]

[SystemMonitor]
interval = 1

[SystemMonitor:cpu]
show = cpu

[locker]
password_prompt = no
show_avatar = no
date_format = %A %d %B
