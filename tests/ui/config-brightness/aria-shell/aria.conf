# The brightness scenario's shell: the Brightness gadget on both bars,
# over the fake ddcutil every scenario has on its PATH (tests/ui/bin:
# two monitors, one per output); no backlight, so the machine's own
# panel stays out of it.
[general]
language = en
style =
reload_style = no
reload_config = no

[panel]
outputs = all
position = top
layer = top
items_center = Clock Brightness

[Clock]

[Brightness]
backlight = no
show_percent = yes
settings_command = sh -c 'echo settings >> "$ARIA_UI_OUT/brightness-settings"'

[osd]
duration = 1
