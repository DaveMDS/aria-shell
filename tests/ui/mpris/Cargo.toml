[package]
name = "aria-mpris"
version = "0.0.1"
edition = "2024"
description = "A fake MPRIS media player, for the UI scenarios (tests/ui)"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
