# Aria Shell (Rust) - sample/dev configuration
#
# [Name] is the default instance of a section, [Name:id] an extra one.
# Empty values mean "use the default". No inline comments.
#
# Keys are bound in the compositor, to `aria-shell <command>`: see the
# examples in compositors/ (assets/compositors/ in the source tree).

[general]
# the UI language (en, it); empty = the environment's LC_ALL, LC_MESSAGES
# or LANG, in that order
language =
# theme to load on top of the built-in base: a name looked up as
# themes/<name>.css in ~/.config/aria-shell, the XDG data dirs and
# assets/, or a path. Empty = base only. See assets/base.css.
style =
# light | dark: the colour scheme the theme is loaded for (:root.light /
# :root.dark variables); the Themes gadget switches it at runtime
color_scheme = light
# reload the theme when its file changes
reload_style = yes
# rebuild the panels when this file changes
reload_config = yes
# icon theme for window icons; empty = the GTK one from settings.ini, else Adwaita
icon_theme =
# the terminal emulator, for `aria-shell open terminal`, desktop entries
# with Terminal=true and the system monitor: a command line, the program to run in place of %c
# (`-e` and the program last when there's no %c), e.g. `kitty %c`,
# `wezterm start -- %c`; auto = $TERMINAL, else the first of kitty,
# alacritty, foot, terminology, wezterm, ghostty, gnome-terminal,
# konsole, xfce4-terminal, xterm found; none (or off) = no terminal
terminal = auto
# the file manager, for `aria-shell open file-manager [dir]` (the home
# without a dir): a command line, the directory in place of %f (last
# when there's no %f), e.g. `thunar %f`; auto = the first of nautilus,
# dolphin, nemo, thunar, caja, pcmanfm-qt, pcmanfm found; none (or off)
# = no file manager
file_manager = auto

# programs run once when the shell starts (not on a config reload), in
# this order: `name = command line`, the name only for the log. Command
# lines as everywhere here: no shell, write `sh -c '...'` for one
[autostart]
# applet = nm-applet --indicator

# the application launcher, toggled with `aria-shell launcher toggle`
# (bind it in the compositor); size and look come from the theme
[launcher]
# the exit menu's buttons as a row of icons above the search field:
# all, none, or names from [exiter] buttons
actions = all

# the desktop background: an image (png, jpg, webp) as an absolute
# path, ~/..., or a path relative to this file's directory; empty =
# none. `fit` is CSS object-fit: cover (fills the output, edges cropped),
# contain (whole image, bands of the theme's `wallpaper` background),
# fill (stretched), none (1:1, centred), scale-down (none, shrunk when
# it doesn't fit). A [wallpaper:<connector>] section with a source wins
# on that output
[wallpaper]
source =
fit = cover

# the exit menu, `aria-shell exiter toggle` (bind it, or put it on a
# [Custom] button): a grid of buttons, `columns` per row, in the order
# of `buttons`. Each name has its command line (a program, not a shell;
# a `!` in front asks a confirmation, run by itself after
# confirm_timeout seconds, 0 = never) and optionally <name>_icon and
# <name>_label; the six standard ones have defaults, `auto` for logout
# asks the compositor itself
[exiter]
columns = 3
ask_confirm = yes
confirm_timeout = 30
buttons = lock suspend hibernate logout reboot shutdown
lock = aria-shell lock
suspend = systemctl suspend
hibernate = systemctl hibernate
logout = !auto
reboot = !systemctl reboot
shutdown = !systemctl poweroff
# a custom one:
# firefox = firefox
# firefox_icon = firefox
# firefox_label = Browser

# the lock screen, `aria-shell lock` (bind it in the compositor, or give
# it to an idle daemon). The password is checked with PAM.
[locker]
# require the user password to unlock
password_prompt = yes
# the user picture (~/.face, ~/.face.icon or the AccountsService one)
show_avatar = yes
show_username = yes
# the time and the date, strftime patterns as the Clock's
show_time = yes
show_date = yes
time_format = %H:%M
date_format = %A %d %B
# the PAM service the password is checked with.
# empty = `aria-shell` if /etc/pam.d/aria-shell is installed, else `login`.
pam_service =

# notifications: the daemon (org.freedesktop.Notifications, one popup per
# notification stacked from a screen corner of the focused output; the
# look comes from the theme) and the bar gadget of the same name (a bell
# with the count of the notifications not looked at; left click opens
# the history, right click toggles do-not-disturb, middle click closes
# the popups on screen). The daemon runs whether or not the gadget is
# on a panel.
[Notifications]
# serve notifications at all (off if another daemon should)
enabled = yes
# seconds a notification stays when the app doesn't say (critical ones
# stay until dismissed)
duration = 20
# top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
position = top-right
# how many notifications the gadget's history keeps (0: none)
history = 50
# the gadget's icon names, from the icon theme (the second while
# do-not-disturb is on)
icon = preferences-system-notifications-symbolic
dnd_icon = notifications-disabled-symbolic

# the OSD: a short-lived bar on every screen when something it watches
# changes, whatever changed it (a keybind running wpctl, the Audio
# gadget, another app). It only shows, it never changes anything;
# `aria-shell osd show [--icon <name>] [--value <percent>] [text]`
# shows one from a script (brightness from a brightnessctl keybind).
# Its look is the theme's `osd`.
[osd]
# what to watch: volume (the default output: level and mute),
# microphone (the default input: level and mute), brightness (a
# screen's, shown on that screen), recording (the
# microphone in use by some app, then free again), wifi (on, off),
# network (connected, disconnected), vpn (connected, disconnected),
# charger (plugged in or out, with a battery), profile (the power
# profile), idle (keep awake on, off); none: only `aria-shell osd show`
show = volume microphone brightness recording wifi network vpn charger profile idle
# seconds it stays after the last change
duration = 3
# top | center | bottom (horizontally centred)
position = top
# distance in px from that edge (not for center)
margin = 50

# idle: what happens when nobody touches the machine, each stage with
# its timeout from the last input: the session locks, the screens go off
# (back on at the first input), the machine suspends (through logind).
# Durations: 30s, 5m, 1h; empty or 0 = never. Nothing goes idle while
# held: by the Power gadget's eye (left click; also `aria-shell idle
# inhibit [toggle|on|off]`), by a media player playing, or by an app
# inhibiting idle (a fullscreen video). Every timer counts from the last
# input, whatever the order: a screen_off shorter than lock gives time
# to wake the screens without typing the password.
[Idle]
lock = 10m
screen_off = 15m
suspend = 30m
lock_before_sleep = yes
inhibit_when_playing = yes

# the timeouts on battery (UPower); a key left empty is as on AC, 0 = never
[Idle:battery]
screen_off = 3m
lock = 5m
suspend = 10m

# the battery (UPower) and the power profiles (power-profiles-daemon or
# tuned-ppd): the daemon, and the bar gadget of the same name. On the
# bar the battery, the profile and the idle eye, each with its show_*
# key; the battery only where there is one, the profile only where a
# daemon offers them. Left click on the battery or the profile: the
# popup (charge, time left, health, the peripherals' charge, the profile
# picker, keep awake); on the eye, or a middle click: hold idle / let it
# go; right click: settings_command
[Power]
# a notification when UPower calls the battery low, then critical
# (its own thresholds, /etc/UPower/UPower.conf)
notify_low = yes
show_battery = yes
# the percent after the battery icon
show_percent = yes
show_profile = yes
show_idle = yes
# the power settings, run by the popup's button and a right click
settings_command =
# the eye's icon names: idle may come, and idle held
idle_icon = view-conceal-symbolic
inhibit_icon = view-reveal-symbolic

# the screens' brightness: a laptop's panel (/sys/class/backlight, set
# through logind) and the monitors answering DDC/CI (through ddcutil,
# when it's installed; it needs the i2c-dev module and access to
# /dev/i2c-*). The daemon,
# the bar gadget of the same name and `aria-shell brightness`. On the
# bar an icon: the wheel changes the brightness, a left click opens a
# slider per screen, a right click runs settings_command
[Brightness]
# the laptop's panel
backlight = yes
# percent per wheel click and per `aria-shell brightness up|down`
step = 5
# what the wheel changes: all (every screen) | output (the bar's screen)
wheel = all
# the bar's screen's percent after the icon
show_percent = no
# the display settings, run by the popup's button and a right click
settings_command =

# `aria-shell screenshot`: the picker (a window, a screen or an area);
# `aria-shell screenshot window | output [connector] | all`: at once.
# A file, then opened in the editor with `--edit`; with `--clipboard`
# only copied to the clipboard, no file. The Screenshot gadget: left
# click the picker, right click a menu (window, screen, all)
[Screenshot]
# where the pictures go (Screenshot_<date>_<time>.png)
directory = ~/Pictures/Screenshots
# what `--edit` opens the picture in: a command line, the picture's
# path in place of %f (last when there's no %f), e.g. `satty --filename
# %f --output-filename %f`, `gimp`; auto = the first of satty, swappy,
# ksnip, spectacle found, saving over the picture; none (or off) = no editing
editor = auto
# the gadget's
icon = applets-screenshooter-symbolic

# window class -> desktop entry id or icon name, for apps whose class
# matches none of their desktop entry's id, StartupWMClass or Exec
[apps_class_map]
# jetbrains-pycharm-ce = pycharm

# the system monitor: this section is the sampler's (readings shared by
# every gadget) and the popup's; the gadgets are the instances below,
# one value each
[SystemMonitor]
# seconds between readings (min 1)
interval = 2
# readings kept: the width of the graphs, in time
history = 60
# mount points to show; empty = every real filesystem, one per device
disks =
# interfaces to show; empty = all but the loopback and the virtual ones
interfaces =
# the hwmon sensor (its `name`) for the cpu temperature; empty = auto
temperature =
# rows of the popup's process table, and its initial sort:
# cpu | mem | name | pid
processes = 15
sort = cpu

# a gadget: one value on the bar (as text, a sparkline or a gauge);
# left click opens the monitor popup on the value's tab (cpu, memory,
# disks, network, gpu, processes), right click runs `command`. `show`
# is required.
[SystemMonitor:cpu]
# cpu | mem | swap | disk | net | gpu | temp | load
show = cpu
# text: the format alone; sparkline: the value's history as a small
# graph with the format over it; gauge: a bar filled to the value with
# the format over it
mode = sparkline
# the text; placeholders: {cpu} {mem} {mem_used} {mem_total} {swap} {rx} {tx}
# {read} {write} {disk} {temp} {freq} {load1} {load5} {load15} {uptime}
# {gpu} {vram}; {cpu:3} pads to 3 characters. Empty = the value's own
format = CPU {cpu}%
# the top of the sparkline / the full gauge; empty = 100 for a
# percentage, the highest value seen otherwise (e.g. 90 for temp)
max =
# from these values on the gadget is styled as a warning / critical
# (same unit as the value: %, °C, bytes/s, load); empty = 70 / 90 for
# a percentage, nothing otherwise
warning =
critical =
# an icon name before the text; empty = none
icon =
# right click; empty = btop, htop or top (the first found) in the
# [general] terminal
command =

[SystemMonitor:mem]
show = mem
mode = gauge
format = MEM {mem}%

[SystemMonitor:temp]
show = temp
mode = text
max = 90
warning = 60
critical = 80

[panel]
# all, or connector names: DP-1 HDMI-A-1
outputs = all
# top | bottom
position = top
# bottom | top | overlay
layer = top
items_start = Custom:launcher WorkSpaces
items_center = Themes SystemMonitor:cpu SystemMonitor:mem SystemMonitor:temp Clock Custom:updates Audio
items_end = Tray Network Brightness Power Screenshot Clock:2 Notifications Custom:exiter

[Clock]
# see: https://docs.rs/chrono/latest/chrono/format/strftime/index.html
format = %H:%M:%S

[Clock:2]
format = %e %b %Y

# the status notifier items (nm-applet, megasync, ...); no keys
[Tray]

# the volume: the default output's level as an icon; left click opens
# the mixer (outputs, inputs, the streams playing, the media players),
# the wheel changes the volume, middle click mutes, right click runs
# mixer_command
[Audio]
# a real mixer, run by the popup's button and a right click
mixer_command = pavucontrol
# percent per wheel click, and per `aria-shell volume up|down`
step = 5
# the sliders', the wheel's and `aria-shell volume`'s ceiling, percent
# (up to 150)
max_volume = 100
# the percent after the icon
show_percent = no
# the default input's icon too, with its own wheel / middle click
show_microphone = no
# the popup's sections
show_inputs = yes
show_streams = yes
show_players = yes

# the network, through NetworkManager: the primary connection's icon;
# left click opens the popup (the Wi‑Fi networks around: a click joins
# one, the password asked in place; the wired devices; the VPN profiles
# with a toggle each), middle click turns Wi‑Fi on/off, right click runs
# settings_command
[Network]
# the network settings, run by the popup's button and a right click
settings_command = nm-connection-editor
# the connection's name after the icon
show_label = yes
# the badge on the bar when a VPN is up
show_vpn = yes

# light/dark toggle (left click) and theme picker (right click)
[Themes]
# icon names shown while each scheme is on
light_icon = weather-clear-symbolic
dark_icon = weather-clear-night-symbolic

[WorkSpaces]
# show the workspace name
show_name = yes
# show a marker for each window in the workspace
show_windows = yes
# the active window's icon and title after the workspaces
show_title = yes
# show workspaces from all monitors, not just this panel's one
all_monitors = no
# clicking a window marker focuses that window
focus_window_on_click = no

# a user-defined button: icon and/or label, a program per mouse button,
# optionally a program whose output is the label. Programs run as
# written, without a shell: quote with '' or "", and write `sh -c '...'`
# yourself for pipes or variables. [Custom:id] for more of them.
[Custom:launcher]
# fixed text, and an icon name from the icon theme
label =
icon = start-here-symbolic
# run on the left / right / middle button and on the wheel; the shell's
# own commands are its CLI (`aria-shell launcher toggle`: that name is
# always this very binary, on the PATH or not)
command = aria-shell launcher toggle
command_right =
command_middle =
command_wheel_up =
command_wheel_down =
# program whose standard output is the label, run every `interval`
# seconds (0 = once at start) and again after every command above.
# return_type = text takes the output as is; json reads
# {"text": "..", "icon": "..", "class": ".." or [..]} (waybar's shape;
# the classes style the button: gadget.custom > button.warning)
exec =
interval = 0
return_type = text
# the label: {} is exec's output (or `label` when there's no exec),
# {label} the label key
format = {}
# with exec: show nothing while the output is empty or the program fails
hide_empty = yes

# the exit menu, last on the right
[Custom:exiter]
icon = system-shutdown-symbolic
command = aria-shell exiter toggle

[Custom:updates]
icon = software-update-available-symbolic
exec = sh -c 'checkupdates 2>/dev/null | wc -l | grep -v "^0$"'
interval = 1800
command = kitty -e sh -c 'sudo pacman -Syu; read'
